<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>온기 순찰대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F8;--surface:#FFFFFF;--ink:#1B2430;--sub:#4E5968;--label:#5B6573;--line:#DDE2E8;--line2:#EDF0F3;--field:#C9D0D8;--soft:#F4F6F8;--track:#EEF1F4;--gauge:#4E5968;
  --blue:#1F5FAF;--blue-t:#E7EEF8;--orange:#9A4308;--orange-t:#FBEEE4;--violet:#4B3A78;--violet-t:#ECE8F4;
  --btn:#1B2430;--btn-ink:#FFFFFF;--btn2:#EEF1F4;
  --land:#EEF1EC;--sea:#DCE7F2;--road:#FFFFFF;--road-edge:#D3D9DF;--contour:#DCE3D6;--city:#E2E6EA;--sea-ink:#3F5F80;--halo:#FFFFFF;
  --shadow:rgba(27,36,48,.16);--scrim:rgba(15,20,26,.42);
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F141A;--surface:#1A2129;--ink:#E7ECF2;--sub:#A9B3C0;--label:#9AA5B2;--line:#2B343F;--line2:#232B35;--field:#3A4450;--soft:#222A34;--track:#2B343F;--gauge:#A9B3C0;
    --blue:#8DB8F2;--blue-t:#1C2B40;--orange:#F2B07A;--orange-t:#3A2818;--violet:#C2B2EE;--violet-t:#2B2442;
    --btn:#E7ECF2;--btn-ink:#0F141A;--btn2:#26303B;
    --land:#1C232B;--sea:#16263A;--road:#2E3742;--road-edge:#252D37;--contour:#252E38;--city:#26303B;--sea-ink:#8FB0D6;--halo:#1C232B;
    --shadow:rgba(0,0,0,.5);--scrim:rgba(0,0,0,.6);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F141A;--surface:#1A2129;--ink:#E7ECF2;--sub:#A9B3C0;--label:#9AA5B2;--line:#2B343F;--line2:#232B35;--field:#3A4450;--soft:#222A34;--track:#2B343F;--gauge:#A9B3C0;
  --blue:#8DB8F2;--blue-t:#1C2B40;--orange:#F2B07A;--orange-t:#3A2818;--violet:#C2B2EE;--violet-t:#2B2442;
  --btn:#E7ECF2;--btn-ink:#0F141A;--btn2:#26303B;
  --land:#1C232B;--sea:#16263A;--road:#2E3742;--road-edge:#252D37;--contour:#252E38;--city:#26303B;--sea-ink:#8FB0D6;--halo:#1C232B;
  --shadow:rgba(0,0,0,.5);--scrim:rgba(0,0,0,.6);color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;word-break:keep-all;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
.app.wide{max-width:1120px}
.app.notab{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.hdr{padding:12px 20px 16px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px;gap:8px}
.word{font-size:15px;font-weight:700}
.tag{font-size:12px;line-height:16px;color:var(--sub);border:1px solid var(--field);border-radius:999px;padding:4px 10px;background:var(--surface);white-space:nowrap}
.iconbtn{width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;position:relative;padding:0;border-radius:12px;color:var(--ink)}
.badge{position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:4px;background:#B85A14}
h1{margin:0;font-size:26px;line-height:34px;font-weight:700}
h2{margin:0}
.sub{margin:0;font-size:14px;line-height:21px;color:var(--sub)}
.tiles{padding:0 16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line)}
.tile.on{background:var(--t);border-color:var(--t)}
.tile .n{display:flex;align-items:center;gap:6px;color:var(--c)}
.tile .num{font-size:24px;line-height:30px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.tile .lb{font-size:13px;line-height:18px;font-weight:600;color:var(--c)}
.t-blue{--c:var(--blue);--t:var(--blue-t)}.t-orange{--c:var(--orange);--t:var(--orange-t)}.t-violet{--c:var(--violet);--t:var(--violet-t)}
.sect{display:flex;align-items:baseline;justify-content:space-between;padding:0 20px;margin:20px 0 8px;gap:8px}
.sect h2{font-size:16px;line-height:24px;font-weight:600}
.sect span{font-size:13px;color:var(--sub)}
.stack{padding:0 16px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;border-radius:999px;background:var(--t);color:var(--c);font-size:13px;line-height:18px;font-weight:600;align-self:flex-start}
.chip.plain{background:var(--soft);color:var(--sub)}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.muted{font-size:13px;line-height:19px;color:var(--sub)}
.txt{margin:0;font-size:15px;line-height:22px}
.namebtn{flex:1;min-width:0;min-height:44px;display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:0;text-align:left;color:var(--ink)}
.who{display:flex;flex-direction:column;min-width:0}
.who b{font-size:17px;line-height:24px;font-weight:600}
.who span{font-size:13px;line-height:18px;color:var(--sub)}
.callbtn{width:44px;height:44px;flex:none;border:0;border-radius:12px;background:var(--btn);color:var(--btn-ink);display:flex;align-items:center;justify-content:center;padding:0}
.cells{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cell{background:var(--soft);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cell.hot{background:var(--t)}
.cell small{font-size:12px;line-height:16px;color:var(--label)}
.cell.hot small{color:var(--sub)}
.cell strong{font-size:15px;line-height:22px;font-weight:600;font-variant-numeric:tabular-nums}
.cell.hot strong{color:var(--c)}
.acts{display:flex;gap:8px}
.btn{flex:1;min-height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:600;border:0;padding:0 12px;text-align:center}
.btn.pri{background:var(--btn);color:var(--btn-ink)}
.btn.sec{background:var(--surface);border:1px solid var(--field);color:var(--ink)}
.btn.big{min-height:52px;font-size:16px;border-radius:14px}
.note{margin:0;font-size:13px;line-height:19px;color:var(--blue);font-weight:500}
.list{margin:0 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border:0;border-top:1px solid var(--line2);background:transparent;width:100%;text-align:left;min-height:64px;color:var(--ink)}
.row:first-child{border-top:0}
.row .who b{font-size:16px;line-height:22px}
.sig{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500;flex:none;font-variant-numeric:tabular-nums}
.sig span{display:flex;align-items:center;gap:4px}
.sig .dim{color:var(--label)}
.empty{margin:0 16px;padding:20px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:15px;line-height:22px;color:var(--sub)}
.bar{height:56px;padding:6px 8px 0;display:flex;align-items:center;gap:4px}
.bar span{font-size:15px;font-weight:500;color:var(--sub)}
.bar h1{font-size:17px;line-height:24px;font-weight:600}
.page{padding:4px 16px 24px;display:flex;flex-direction:column;gap:16px}
.verdict{background:var(--t);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.verdict.ok{background:var(--surface);border:1px solid var(--line)}
.verdict .chip{background:var(--surface)}
.verdict h2{font-size:22px;line-height:30px;font-weight:700}
.sigbox{background:var(--surface);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.verdict.ok .sigbox{background:var(--soft)}
.sigbox small{font-size:12px;line-height:16px;color:var(--label)}
.sigbox strong{font-size:15px;line-height:22px;font-weight:600;font-variant-numeric:tabular-nums}
.sigbox.hot strong,.sigbox.hot svg{color:var(--c)}
.sigbox svg{color:var(--sub)}
.legend{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--sub);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.chart{display:block;width:100%;height:auto}
.gauge{position:relative;height:14px;border-radius:7px;background:var(--track)}
.gauge>div{height:100%;border-radius:7px;background:var(--gauge)}
.gauge>div.low{background:#B85A14}
.gauge>i{position:absolute;top:-4px;width:2px;height:22px;background:#B85A14}
.big{font-size:28px;line-height:34px;font-weight:700;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{padding:8px 12px;border-radius:10px;border:1px solid var(--line);font-size:14px;line-height:20px}
.raw{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.raw li{display:flex;justify-content:space-between;gap:12px;font-size:14px;line-height:20px}
.raw li span:first-child{color:var(--sub)}
.raw li span:last-child{font-variant-numeric:tabular-nums;text-align:right}
details summary{cursor:pointer;font-size:16px;line-height:24px;font-weight:600;list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:24px}
details summary::-webkit-details-marker{display:none}
details[open] summary svg{transform:rotate(90deg)}
fieldset{margin:0;padding:0;border:0;min-width:0;display:flex;flex-direction:column;gap:8px}
legend{padding:0;margin-bottom:10px;font-size:18px;line-height:26px;font-weight:700}
.opt{display:flex;align-items:flex-start;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer}
.opt.sel{border:2px solid var(--ink);padding:11px}
.opt input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--ink);flex:none}
.opt b{display:block;font-size:16px;line-height:22px;font-weight:600}
.opt span{display:block;font-size:13px;line-height:19px;color:var(--sub)}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px;line-height:22px;cursor:pointer}
.check input{width:20px;height:20px;margin:0;accent-color:var(--ink);flex:none}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:4px}
.box h3{margin:0 0 8px;font-size:16px;line-height:24px;font-weight:600}
textarea{width:100%;min-height:88px;resize:vertical;padding:12px;border:1px solid var(--field);border-radius:12px;background:var(--surface);font-size:15px;line-height:22px}
label.lbl{font-size:14px;line-height:20px;font-weight:600}
.timeline{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.timeline li{display:flex;gap:12px}
.timeline .rail{width:12px;flex:none;display:flex;flex-direction:column;align-items:center}
.timeline .rail i{width:10px;height:10px;border-radius:5px;background:var(--ink);margin-top:5px;flex:none}
.timeline .rail i.a{background:#2A66B8}
.timeline .rail em{width:2px;flex:1;background:var(--line);margin-top:4px}
.timeline .body{display:flex;flex-direction:column;gap:4px;padding-bottom:18px}
.timeline li:last-child .body{padding-bottom:0}
.timeline time{font-size:13px;line-height:20px;font-weight:600;color:var(--sub)}
.timeline p{margin:0;font-size:15px;line-height:22px}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.duo .cell{padding:16px;border-radius:16px;gap:4px}
.duo .cell b{font-size:20px;line-height:28px;font-weight:700}
.duo .cell.hot b{color:var(--c)}
.mapwrap{margin:0 16px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--land)}
.mapwrap svg{display:block;width:100%;height:auto}
.pin{cursor:pointer}
.pin:focus-visible{outline:none}
.pin:focus-visible circle.ring{stroke:var(--ink);stroke-width:3}
.tabbar{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));z-index:20}
.tabbar[hidden]{display:none}
.tabbar button{height:62px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:500;color:var(--label);padding:0}
.tabbar button[aria-current="page"]{color:var(--ink);font-weight:600}
.fab{position:fixed;z-index:25;right:max(16px,calc(50% - 224px));bottom:calc(76px + env(safe-area-inset-bottom,0px));height:48px;padding:0 16px 0 14px;border-radius:24px;border:0;background:var(--btn);color:var(--btn-ink);display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;box-shadow:0 8px 20px var(--shadow)}
.fab[hidden]{display:none}
.fab.low{bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.banner{position:fixed;top:0;left:0;right:0;max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 0;z-index:40;transform:translateY(-130%);transition:transform .35s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.banner.show{transform:none;pointer-events:auto}
.bcard{background:var(--surface);border-radius:24px;padding:14px;box-shadow:0 12px 32px var(--shadow),0 0 0 1px var(--line);display:flex;flex-direction:column;gap:12px}
.bn{display:flex;gap:12px}
.appicon{width:40px;height:40px;border-radius:11px;background:#1B2430;flex:none;display:flex;align-items:center;justify-content:center;position:relative}
.appicon i{position:absolute;left:17px;top:20px;width:6px;height:6px;border-radius:3px;background:#F0A65E}
.bt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.meta{display:flex;justify-content:space-between;font-size:13px;line-height:18px}
.meta b{font-weight:600}.meta span{color:var(--label)}
.bt .t{font-size:15px;line-height:22px;font-weight:600}
.bt .b{font-size:14px;line-height:20px;color:var(--sub)}
.bacts{display:flex;gap:8px}
.bacts button{flex:1;min-height:44px;border-radius:12px;background:var(--btn2);border:0;display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:600;color:var(--ink)}
.ffpill{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translate(-50%,-200%);z-index:35;background:var(--btn);color:var(--btn-ink);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;transition:transform .25s;white-space:nowrap;font-variant-numeric:tabular-nums}
.ffpill.show{transform:translate(-50%,0)}
.toast{position:fixed;left:50%;bottom:calc(136px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:45;background:var(--btn);color:var(--btn-ink);padding:12px 16px;border-radius:14px;font-size:14px;line-height:20px;max-width:min(420px,calc(100% - 32px));transition:opacity .2s,transform .2s;pointer-events:none;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sheet-wrap{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap[hidden]{display:none}
.sheet{width:100%;max-width:480px;max-height:88vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.grab{align-self:center;width:36px;height:4px;border-radius:2px;background:var(--field)}
.sheet h2{font-size:20px;line-height:28px;font-weight:700}
.sheet .grp{display:flex;flex-direction:column;gap:8px}
.sheet .grp>b{font-size:14px;line-height:20px;font-weight:600}
.scen{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.scen button{min-height:84px;border-radius:14px;border:0;background:var(--t);color:var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:14px;line-height:19px;font-weight:600;padding:8px}
select{min-height:48px;border-radius:12px;border:1px solid var(--field);background:var(--surface);padding:0 12px;font-size:15px;width:100%}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--btn2);border-radius:12px;padding:4px;gap:4px}
.seg button{min-height:40px;border:0;border-radius:9px;background:transparent;font-size:14px;font-weight:600;color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.clock{font-size:14px;line-height:20px;color:var(--sub);font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:16px;padding:0 16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:8px}
.kpi h2{font-size:14px;line-height:20px;font-weight:600;color:var(--sub)}
.kpi .v{font-size:30px;line-height:38px;font-weight:700;font-variant-numeric:tabular-nums}
.stackbar{display:flex;gap:3px;height:20px}
.stackbar span{border-radius:4px}
.tbl-box{margin:0 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px}
.tbl-scroll{overflow-x:auto}
table{width:100%;min-width:760px;border-collapse:collapse;font-size:15px;line-height:22px;font-variant-numeric:tabular-nums}
th,td{padding:12px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle}
thead th{background:var(--soft);font-size:13px;font-weight:600;color:var(--sub);border-bottom:0}
td.r,th.r{text-align:right}
tbody tr:last-child th,tbody tr:last-child td{border-bottom:0}
.mini{display:flex;gap:2px}
.mini span{height:12px;border-radius:3px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.coach{position:fixed;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto;padding:0 12px;z-index:30;pointer-events:none}
.coach.low{bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.coach[hidden],.coach-scrim[hidden]{display:none}
.coach .cc{pointer-events:auto;background:var(--surface);border-radius:20px;padding:14px 16px 16px;box-shadow:0 10px 30px var(--shadow),0 0 0 1px var(--line);display:flex;flex-direction:column;gap:8px}
.coach .step{font-size:13px;font-weight:600;color:var(--blue)}
.coach h2{font-size:18px;line-height:26px;font-weight:700}
.coach .skip{min-height:44px;padding:0 4px;border:0;background:transparent;color:var(--sub);font-size:14px;font-weight:500}
.coach .btn{margin-top:4px}
.coach-scrim{position:fixed;inset:0;background:var(--scrim);z-index:29}
.start{position:fixed;inset:0;z-index:55;background:var(--bg);overflow:auto;display:flex;justify-content:center}
.start[hidden],.fabhint[hidden]{display:none}
.start .in{width:100%;max-width:440px;min-height:100%;padding:calc(env(safe-area-inset-top,0px) + 32px) 24px calc(env(safe-area-inset-bottom,0px) + 32px);display:flex;flex-direction:column;justify-content:center;gap:22px}
.start .logo{width:64px;height:64px;border-radius:18px;background:#1B2430;display:flex;align-items:center;justify-content:center;position:relative}
.start .logo i{position:absolute;left:28px;top:33px;width:9px;height:9px;border-radius:5px;background:#F0A65E}

.app.touring{padding-bottom:calc(320px + env(safe-area-inset-bottom,0px))}

function ic(name, size = 20, extra = '') { return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${ICONS[name]}</svg>`; }

/* ==============================================================
   상태
   ============================================================== */
let state = null;
const ui = { tab: 'today', detail: null, record: null, form: null, ff: false, sheetOpen: false, tour: null, start: false, hint: false };

function newState() {
  const rand = rng(20270114);
  const houses = SEED.map((s, i) => {
    const kBase = 0.0628 * (0.9 + rand() * 0.2);
    return {
      id: i, name: s[0], parent: s[1] === 'f' ? '어머니' : '아버지', area: s[2], village: s[3],
      guardian: { rel: s[4], name: s[5] },
      cap: 200, setLow: r1(17.6 + rand() * 0.8), setHigh: 0, kBase,
      sim: { T: 18.6 + rand() * 1.2, levelL: s[6] * 2, k: kBase, forcedOff: false, firing: false },
      live: null, lastFiringTs: null, hist: [], acc: { n: 0, f: 0 }, status: 'ok'
    };
  });
  houses.forEach(h => { h.setHigh = r1(h.setLow + 1.6 + rand() * 0.6); });
  return { v: 1, now: START - 24 * HOUR, houses, alerts: [], events: [], nextAlertId: 1, playing: true, role: 'worker', sel: 0 };
}

function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* 저장 못 해도 시연은 계속돼요 */ } }
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || s.v !== 1 || !Array.isArray(s.houses) || s.houses.length !== SEED.length) return null;
    return s;
  } catch (e) { return null; }
}
const byId = id => state.houses[id];

/* ==============================================================
   센서 입력 → 가구 상태
   실제 센서 값도 이 함수로 들어와요
   ============================================================== */
function ingest(r) {
  const h = byId(r.householdId);
  if (!h) return;
  const levelPct = clamp((SENSOR.tankHeightCm + SENSOR.sensorGapCm - r.tankDistanceCm) / SENSOR.tankHeightCm * 100, 0, 100);
  const boiler = r.boilerCurrentA >= SENSOR.firingA ? 'firing' : r.boilerCurrentA >= SENSOR.poweredA ? 'idle' : 'off';
  h.live = { ts: r.ts, levelPct, boiler, tempC: r.indoorTempC, hum: r.indoorHumidity, raw: r };
  if (boiler === 'firing' || h.lastFiringTs == null) h.lastFiringTs = boiler === 'firing' ? r.ts : (h.lastFiringTs ?? r.ts);
  h.acc.n++; if (boiler === 'firing') h.acc.f++;
  const last = h.hist[h.hist.length - 1];
  if (!last || r.ts - last.t >= 10 * MIN) {
    h.hist.push({ t: r.ts, T: r1(r.indoorTempC), f: r2(h.acc.f / h.acc.n), lv: r1(levelPct) });
    h.acc = { n: 0, f: 0 };
    const cut = r.ts - 25 * HOUR;
    while (h.hist.length && h.hist[0].t < cut) h.hist.shift();
  }
}

/* ==============================================================
   판정: 왜 추운지 가려내요
   ============================================================== */
function idleHours(h) { return h.live ? (h.live.ts - (h.lastFiringTs ?? h.live.ts)) / HOUR : 0; }
function firingShare(h, hours) {
  const from = h.live.ts - hours * HOUR;
  const w = h.hist.filter(p => p.t > from);
  return { n: w.length, share: w.length ? w.reduce((s, p) => s + p.f, 0) / w.length : 0 };
}
function judge(h) {
  const L = h.live;
  if (!L) return { type: 'ok' };
  if (L.levelPct < RULES.fuelLowPct) return { type: 'fuel_low' };
  if (idleHours(h) >= RULES.boilerIdleHours && L.tempC <= RULES.coldIndoorC) return { type: 'boiler_off' };
  const fs = firingShare(h, RULES.insulShareWindowH);
  const recent = h.hist.filter(p => p.t > L.ts - RULES.insulMaxWindowH * HOUR);
  const maxT = recent.length ? Math.max(...recent.map(p => p.T)) : L.tempC;
  if (fs.n >= RULES.insulShareWindowH * 6 * 0.8 && fs.share >= RULES.insulFiringShare && maxT < RULES.insulMaxC) return { type: 'insulation' };
  return { type: 'ok' };
}
function dailyUseL(h) { const fs = firingShare(h, 24); return Math.max(1, fs.share * SIM.burnLph * 24); }
function daysLeft(h) { return (h.live.levelPct / 100 * h.cap) / dailyUseL(h); }
function daysLeftText(h) { const d = daysLeft(h); return d < 1 ? '하루도 못 가요' : `약 ${Math.round(d)}일 쓸 수 있어요`; }

function sentence(h, type) {
  const L = h.live;
  if (type === 'boiler_off') return `기름은 있는데 보일러가 ${Math.floor(idleHours(h))}시간째 돌지 않고, 실내가 ${L.tempC.toFixed(1)}℃까지 내려갔어요.`;
  if (type === 'fuel_low') return `기름이 ${Math.round(L.levelPct)}% 남았어요. 지금처럼 쓰면 ${daysLeftText(h)}.`;
  if (type === 'insulation') return `보일러가 계속 도는데도 실내가 ${L.tempC.toFixed(1)}℃에 머물러요. 외풍이나 단열 문제일 수 있어요.`;
  return '';
}
function bannerTitle(h, type, forGuardian) {
  const who = forGuardian ? `${h.parent} 댁` : `${h.name} 어르신 댁`;
  if (type === 'boiler_off') return `${who} 보일러가 꺼져 있어요`;
  if (type === 'fuel_low') return `${who} 기름이 얼마 안 남았어요`;
  return forGuardian ? `${h.parent} 댁이 잘 데워지지 않아요` : `${h.name} 어르신 댁이 잘 데워지지 않아요`;
}
function guardianAlertText(h, type) {
  if (type === 'boiler_off') return `보일러가 ${Math.floor(idleHours(h))}시간째 돌지 않아서 담당 생활지원사 ${WORKER}님께 알렸어요.`;
  if (type === 'fuel_low') return `기름이 ${Math.round(h.live.levelPct)}% 남아서 담당 생활지원사 ${WORKER}님께 알렸어요.`;
  return `보일러가 계속 도는데도 집이 잘 데워지지 않아 담당 생활지원사 ${WORKER}님께 알렸어요.`;
}

/* 판정 결과가 바뀌면 알림을 만들어요 */
function evaluate(h, quiet) {
  const j = judge(h);
  h.status = j.type;
  const mine = state.alerts.filter(a => a.hid === h.id);
  if (j.type !== 'ok') {
    let active = mine.find(a => a.type === j.type && !a.cleared) || mine.find(a => a.type === j.type && a.status === 'open');
    if (active) { active.cleared = false; if (active.status === 'open') active.recovered = false; return null; }
    const a = {
      id: state.nextAlertId++, hid: h.id, type: j.type, ts: h.live.ts, status: 'open', cleared: false, recovered: false,
      title: bannerTitle(h, j.type, false), body: sentence(h, j.type), gTitle: bannerTitle(h, j.type, true)
    };
    state.alerts.push(a);
    state.events.push({ hid: h.id, ts: h.live.ts, kind: 'alert', text: guardianAlertText(h, j.type) });
    if (!quiet) queueBanner(a);
    return a;
  }
  mine.forEach(a => { if (!a.cleared) { a.cleared = true; if (a.status === 'open') a.recovered = true; } });
  return null;
}

/* ==============================================================
   3) 데이터 소스
   지금: SimulatedSource가 1분마다 가상 원시값을 만들어요.
   실제 센서를 달면 이런 식으로 바꿔 끼우면 돼요 (서버 주소는 예시).

   const ApiSource = {
     async pull(sinceTs) {
       const res = await fetch('/api/readings?since=' + sinceTs);
       const readings = await res.json();       // 위 원시값 형식의 배열
       readings.forEach(r => { ingest(r); evaluate(byId(r.householdId)); });
     }
   };
   ============================================================== */
const SIM = { burnLph: 1.2, P: 3.1 };
function outsideTemp(ts) { const d = new Date(ts); const hr = d.getHours() + d.getMinutes() / 60; return -5 + 4 * Math.sin(2 * Math.PI * (hr - 9) / 24); }
const SimulatedSource = {
  read(h, ts) {
    const s = h.sim, dt = 1 / 60;
    const powered = !s.forcedOff, hasFuel = s.levelL > 0.5;
    if (!powered || !hasFuel) s.firing = false;
    else if (s.T <= h.setLow) s.firing = true;
    else if (s.T >= h.setHigh) s.firing = false;
    s.T += ((s.firing ? SIM.P : 0) - s.k * (s.T - outsideTemp(ts))) * dt;
    if (s.firing) s.levelL = Math.max(0, s.levelL - SIM.burnLph * dt);
    const n = Math.random() - 0.5;
    return {
      householdId: h.id, ts,
      tankDistanceCm: r1(SENSOR.sensorGapCm + SENSOR.tankHeightCm * (1 - s.levelL / h.cap) + n * 0.2),
      boilerCurrentA: s.firing ? r2(1.76 + n * 0.1) : powered ? r2(0.32 + n * 0.04) : r2(0.02 + Math.abs(n) * 0.02),
      indoorTempC: r1(s.T + n * 0.1),
      indoorHumidity: Math.round(42 + n * 4)
    };
  }
};

/* 가상 시계를 minutes만큼 진행해요 */
function advance(minutes, opts = {}) {
  let created = [];
  for (let m = 0; m < minutes; m++) {
    state.now += MIN;
    for (const h of state.houses) {
      ingest(SimulatedSource.read(h, state.now));
      if (!opts.noEval) { const a = evaluate(h, opts.quiet); if (a) created.push(a); }
    }
    if (opts.stopHid != null && created.some(a => a.hid === opts.stopHid)) return { stopped: true, created, done: m + 1 };
  }
  return { stopped: false, created, done: minutes };
}

function boot() {
  state = newState();
  advance(24 * 60, { noEval: true });
  state.houses.forEach(h => evaluate(h, true));
  state.alerts = []; state.events = []; state.nextAlertId = 1;
  state.houses.forEach(h => { h.status = judge(h).type; });
  save();
}

/* ==============================================================
   화면 조각
   ============================================================== */
const openAlerts = () => state.alerts.filter(a => a.status === 'open').sort((a, b) => TYPES[a.type].prio - TYPES[b.type].prio || a.ts - b.ts);
function boilerLabel(h) {
  if (h.status === 'boiler_off') return '꺼짐';
  return { firing: '가동', idle: '쉼', off: '꺼짐' }[h.live.boiler];
}
function chip(type) { const t = TYPES[type]; return `<span class="chip ${t.cls}">${ic(t.icon, 16)}${t.label}</span>`; }
function elapsed(h, a) {
  if (a.type === 'boiler_off') return `${Math.floor(idleHours(h))}시간째`;
  if (a.type === 'fuel_low') { const d = daysLeft(h); return d < 1 ? '하루 안 남음' : `약 ${Math.round(d)}일분`; }
  return `${Math.floor((state.now - a.ts) / HOUR) + RULES.insulMaxWindowH}시간째`;
}
function cells(h, type) {
  const L = h.live, cls = type ? TYPES[type].cls : '';
  const hotF = type === 'fuel_low', hotB = type === 'boiler_off', hotT = type === 'boiler_off' || type === 'insulation';
  return `<div class="cells ${cls}">
    <div class="cell${hotF ? ' hot' : ''}"><small>기름</small><strong>${Math.round(L.levelPct)}%</strong></div>
    <div class="cell${hotB ? ' hot' : ''}"><small>보일러</small><strong>${boilerLabel(h)}</strong></div>
    <div class="cell${hotT ? ' hot' : ''}"><small>실내</small><strong>${L.tempC.toFixed(1)}℃</strong></div>
  </div>`;
}
function alertCard(a) {
  const h = byId(a.hid);
  return `<article class="card ${TYPES[a.type].cls}">
    <div class="between">${chip(a.type)}<span class="muted">${elapsed(h, a)}</span></div>
    <div style="display:flex;align-items:center;gap:8px">
      <button type="button" class="namebtn" data-act="detail" data-hid="${h.id}">
        <span class="who"><b>${h.name} 어르신</b><span>${h.area} ${h.village}</span></span>
        <span style="margin-left:auto;color:var(--label)">${ic('chev', 18)}</span>
      </button>
    </div>
    <p class="txt">${a.recovered ? '지금은 정상으로 돌아왔어요. 통화로 상황을 확인하고 기록해 주세요.' : sentence(h, a.type)}</p>
    ${cells(h, a.recovered ? null : a.type)}
    <div class="acts">
      <button type="button" class="btn pri" data-act="call" data-hid="${h.id}" data-to="elder">${ic('phone', 18)}전화하기</button>
      <button type="button" class="btn sec" data-act="record" data-aid="${a.id}">확인 결과 기록</button>
    </div>
  </article>`;
}
function houseRow(h, extra = '') {
  const L = h.live, b = L.boiler === 'firing';
  return `<button type="button" class="row" data-act="detail" data-hid="${h.id}">
    <span class="who"><b>${h.name} 어르신</b><span>${extra || `${h.area} ${h.village}`}</span></span>
    <span class="sig" aria-label="기름 ${Math.round(L.levelPct)}%, 보일러 ${boilerLabel(h)}, 실내 ${L.tempC.toFixed(1)}도">
      <span>${ic('drop', 14, 'style="color:var(--sub)"')}${Math.round(L.levelPct)}%</span>
      <span class="${b ? '' : 'dim'}">${ic('flame', 14)}${boilerLabel(h)}</span>
      <span>${ic('thermo', 14, 'style="color:var(--sub)"')}${L.tempC.toFixed(1)}℃</span>
    </span>
  </button>`;
}
function tiles(open) {
  return `<div class="tiles">${Object.keys(TYPES).map(k => {
    const n = open.filter(a => a.type === k).length, t = TYPES[k];
    return `<div class="tile ${t.cls}${n ? ' on' : ''}"><div class="n">${ic(t.icon, 18)}<span class="num">${n}</span></div><span class="lb">${t.label}</span></div>`;
  }).join('')}</div>`;
}
function workerTop(title, sub) {
  const n = openAlerts().length;
  return `<header class="hdr">
    <div class="top"><span class="word">온기 순찰대</span>
      <span style="display:flex;align-items:center;gap:4px"><span class="tag">가상 센서로 시연 중</span>
      <button type="button" class="iconbtn" data-act="tab" data-tab="log" aria-label="알림 기록${n ? `, 확인할 알림 ${n}건` : ''}">${ic('bell', 22)}${n ? '<span class="badge" aria-hidden="true"></span>' : ''}</button></span>
    </div>
    <h1>${title}</h1>${sub ? `<p class="sub">${sub}</p>` : ''}
  </header>`;
}

/* ---------- 생활지원사: 오늘 ---------- */
function viewToday() {
  const open = openAlerts();
  const openH = new Set(open.map(a => a.hid));
  const done = state.alerts.filter(a => a.status === 'done' && state.now - a.doneTs < 24 * HOUR).sort((a, b) => b.doneTs - a.doneTs);
  const doneH = new Set(done.map(a => a.hid));
  const okList = state.houses.filter(h => !openH.has(h.id) && !(doneH.has(h.id) && h.status !== 'ok'));
  const total = state.houses.length;
  const stamp = `${fmtDate(state.now)} ${fmtTime(state.now)} 기준이에요.`;
  const title = openH.size ? `오늘 확인할 집 ${openH.size}곳` : '오늘 확인할 집이 없어요';
  const sub = openH.size ? `${stamp} 담당 ${total}가구 중 ${total - openH.size}가구는 확인할 일이 없어요.` : `${stamp} 담당 ${total}가구 모두 이상 없어요.`;
  return `${workerTop(title, sub)}${tiles(open)}
    ${open.length ? `<div class="sect"><h2>확인할 집 ${openH.size}곳</h2><span>전화로 먼저 확인해 주세요</span></div><div class="stack">${open.map(alertCard).join('')}</div>` : ''}
    ${done.length ? `<div class="sect"><h2>확인 완료</h2></div><div class="list">${done.map(a => houseRow(byId(a.hid), `${TYPES[a.type].label}, ${REASONS[a.type].find(r => r.id === a.reason)?.b || '확인함'}`)).join('')}</div>` : ''}
    <div class="sect"><h2>${open.length ? `이상 없는 집 ${okList.length}곳` : '담당 가구'}</h2></div>
    <div class="list">${okList.map(h => houseRow(h)).join('')}</div>`;
}

/* ---------- 생활지원사: 지도 ---------- */
function housePos(h) {
  const base = AREA_POS[h.area];
  const idx = state.houses.filter(x => x.area === h.area && x.id < h.id).length;
  const j = JITTER[idx % JITTER.length];
  return [base[0] + j[0], base[1] + j[1]];
}
function viewMap() {
  const open = openAlerts();
  const order = new Map(); open.forEach(a => { if (!order.has(a.hid)) order.set(a.hid, { n: order.size + 1, type: a.type }); });
  const okDots = state.houses.filter(h => !order.has(h.id)).map(h => { const [x, y] = housePos(h); return `<circle cx="${x}" cy="${y}" r="5" fill="#8A94A3" stroke="var(--halo)" stroke-width="2"></circle>`; }).join('');
  const pins = [...order.entries()].map(([hid, o]) => {
    const h = byId(hid), [x, y] = housePos(h);
    return `<g class="pin" role="button" tabindex="0" data-act="detail" data-hid="${hid}" aria-label="${o.n}번 ${h.name} 어르신, ${TYPES[o.type].label}">

/* ---------- 생활지원사: 가구 상세 ---------- */
function chartSVG(h) {
  const x0 = 30, x1 = 318, y0 = 16, y1 = 140, now = h.live.ts, start = now - 24 * HOUR;
  const pts = h.hist.filter(p => p.t >= start);
  if (pts.length < 2) return '';
  const temps = pts.map(p => p.T);
  const lo = Math.min(8, Math.floor(Math.min(...temps)) - 1), hi = Math.max(22, Math.ceil(Math.max(...temps)) + 1);
  const X = t => x0 + (t - start) / (24 * HOUR) * (x1 - x0);
  const Y = T => y1 - (T - lo) / (hi - lo) * (y1 - y0);
  const poly = pts.map(p => `${X(p.t).toFixed(1)},${Y(p.T).toFixed(1)}`).join(' ');
  let bars = '', seg = null;
  const segW = (10 * MIN) / (24 * HOUR) * (x1 - x0);
  pts.forEach(p => {
    if (p.f >= 0.5) { const x = X(p.t) - segW; if (seg && Math.abs(seg.end - x) < 0.5) seg.end = X(p.t); else { if (seg) bars += `<rect x="${Math.max(x0, seg.x).toFixed(1)}" y="152" width="${(seg.end - Math.max(x0, seg.x)).toFixed(1)}" height="10" rx="2"></rect>`; seg = { x, end: X(p.t) }; } }
  });
  if (seg) bars += `<rect x="${Math.max(x0, seg.x).toFixed(1)}" y="152" width="${(seg.end - Math.max(x0, seg.x)).toFixed(1)}" height="10" rx="2"></rect>`;
  let band = '';
  if (h.status === 'boiler_off' && h.lastFiringTs) {
    const bx = Math.max(x0, X(h.lastFiringTs));
    band = `<rect x="${bx.toFixed(1)}" y="${y0}" width="${(x1 - bx).toFixed(1)}" height="${y1 - y0}" fill="var(--blue-t)"></rect><text x="${((bx + x1) / 2).toFixed(1)}" y="31" text-anchor="middle" font-size="11" font-weight="600" fill="var(--blue)">${x1 - bx > 50 ? '꺼진 뒤' : ''}</text>`;
  }
  const grid = [10, 15, 20].filter(v => v > lo && v < hi).map(v => `<line x1="${x0}" y1="${Y(v).toFixed(1)}" x2="${x1}" y2="${Y(v).toFixed(1)}" stroke="var(--line2)"></line><text x="25" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--label)">${v}℃</text>`).join('');
  const xl = [0, 1, 2, 3, 4].map(k => { const t = start + k * 6 * HOUR; const x = X(t); const anchor = k === 0 ? 'start' : k === 4 ? 'end' : 'middle'; return `<text x="${x.toFixed(1)}" y="184" text-anchor="${anchor}" font-size="11" fill="var(--label)">${k === 4 ? '지금' : fmtHour(t)}</text>`; }).join('');
  const last = pts[pts.length - 1];
  const hot = h.status === 'boiler_off' || h.status === 'insulation';
  const dot = hot ? (h.status === 'boiler_off' ? 'var(--blue)' : 'var(--violet)') : 'var(--ink)';
  return `<svg class="chart" viewBox="0 0 324 190" role="img" aria-label="지난 24시간 실내 온도. 지금 ${h.live.tempC.toFixed(1)}도.">
    ${band}${grid}
    <polyline points="${poly}" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></polyline>
    <circle cx="${X(last.t).toFixed(1)}" cy="${Y(last.T).toFixed(1)}" r="4.5" fill="${dot}" stroke="var(--surface)" stroke-width="2"></circle>
    <rect x="${x0}" y="152" width="${x1 - x0}" height="10" rx="3" fill="var(--track)"></rect>
    <g fill="#8A94A3">${bars}</g>
    ${xl}
  </svg>`;
}
const POSSIBLE = { boiler_off: ['외출 중', '보일러 고장', '비용 때문에 꺼 둠'], fuel_low: ['주문을 깜빡함', '비용 때문에 미룸'], insulation: ['창문 열림', '문틈 외풍', '단열 부족'] };
const VERDICT = { boiler_off: '기름은 있는데 보일러가 꺼진 채 집이 식고 있어요', fuel_low: '기름이 곧 떨어져요', insulation: '보일러는 도는데 집이 데워지지 않아요', ok: '따뜻하게 지내고 계세요' };
function verdictSub(h) {
  if (h.status === 'boiler_off') return `${fmtTime(h.lastFiringTs)}부터 ${Math.floor(idleHours(h))}시간째 돌지 않아요.`;
  if (h.status === 'fuel_low') return `약 ${Math.round(h.live.levelPct * h.cap / 100)}L 남았어요. 하루 평균 ${Math.round(dailyUseL(h))}L를 써요.`;
  if (h.status === 'insulation') { const fs = firingShare(h, RULES.insulShareWindowH); return `최근 ${RULES.insulShareWindowH}시간 중 ${Math.round(fs.share * 100)}% 동안 보일러가 돌았어요.`; }
  return '기름, 보일러, 실내 온도 모두 괜찮아요.';
}

function viewAdmin() {
  const live = {};
  Object.keys(AREA_BASE).forEach(k => live[k] = { b: 0, f: 0, i: 0 });

  const sum = rows.reduce((s, r) => ({ hh: s.hh + r.hh, b: s.b + r.b, f: s.f + r.f, i: s.i + r.i }), { hh: 0, b: 0, f: 0, i: 0 });

      <section class="kpi"><h2>참여 가구</h2><span class="v">${sum.hh}가구</span><span class="muted">8개 읍·면</span></section>
      <section class="kpi"><h2>알림 ${total}건, 이유별로 보면</h2>
        <div class="stackbar" role="img" aria-label="보일러 꺼짐 ${sum.b}건, 기름 부족 ${sum.f}건, 단열 의심 ${sum.i}건"><span style="flex:${sum.b};background:#2A66B8"></span><span style="flex:${sum.f};background:#B85A14"></span><span style="flex:${sum.i};background:#4B3A78"></span></div>
        <div class="legend" style="font-size:14px;color:var(--ink)"><span><i class="sw" style="background:#2A66B8"></i>보일러 꺼짐 ${sum.b}</span><span><i class="sw" style="background:#B85A14"></i>기름 부족 ${sum.f}</span><span><i class="sw" style="background:#4B3A78"></i>단열 의심 ${sum.i}</span></div>
      </section>
      <section class="kpi"><h2>전화 확인</h2><span class="v">${doneN}건 완료</span><span class="muted">${openN + 4}건은 생활지원사가 확인하고 있어요</span></section>
    </div>

        <thead><tr><th scope="col">읍·면·동</th><th scope="col" class="r">참여 가구</th><th scope="col" class="r">보일러 꺼짐</th><th scope="col" class="r">기름 부족</th><th scope="col" class="r">단열 의심</th><th scope="col">이유별 분포</th><th scope="col">먼저 할 일</th></tr></thead>

/* ---------- 빨리 감기 ---------- */
function fastForward(totalMin, stopHid) {
  if (ui.ff) return;
  ui.ff = true;
  const pill = $('#ffpill');
  let doneMin = 0;
  const per = Math.max(1, Math.ceil(totalMin / 75));
  pill.classList.add('show');
  const step = () => {
    const n = Math.min(per, totalMin - doneMin);
    const res = advance(n, { stopHid });
    doneMin += res.done;
    pill.innerHTML = `${ic('ff', 16)}${fmtDur(doneMin)} 지나는 중, ${fmtTime(state.now)}`;
    renderTick();
    if (res.stopped || doneMin >= totalMin) {
      ui.ff = false; save();
      setTimeout(() => pill.classList.remove('show'), res.stopped ? 400 : 900);
      if (!res.stopped && stopHid != null) toast(`${fmtDur(doneMin)} 지났어요. 아직 알림 조건에 닿지 않았어요.`);
      return;
    }
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('g.pin')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
  if (e.key === 'Escape' && call.on) { if (call.phase === 'ringing') declineCall(); else endCall(); return; }
  if (e.key === 'Escape' && ui.sheetOpen) closeSim();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'simsel') { state.sel = +t.value; save(); if (state.role === 'guardian') renderScreen(); return; }
  if (!ui.form) return;
  if (t.name === 'reason') {
    const memoEl = $('#memo'); if (memoEl) ui.form.memo = memoEl.value;
    const a = state.alerts.find(x => x.id === ui.form.aid);
    const r = REASONS[a.type].find(x => x.id === t.value);
    ui.form.reason = r.id; ui.form.follow = r.f.slice();
    const y = window.scrollY; renderScreen(); window.scrollTo(0, y);
  } else if (t.name === 'follow') {
    const a = state.alerts.find(x => x.id === ui.form.aid);
    const r = REASONS[a.type].find(x => x.id === ui.form.reason);
    const item = r.f[+t.value];
    ui.form.follow = t.checked ? [...new Set([...ui.form.follow, item])] : ui.form.follow.filter(x => x !== item);
  } else if (t.id === 'notify') ui.form.notify = t.checked;
});
document.addEventListener('input', e => { if (e.target.id === 'memo' && ui.form) ui.form.memo = e.target.value; });

/* ---------- 시작 ---------- */
state = load();
if (!state) boot();
const tok = (location.hash || '').slice(1);
if (tok === 'guardian' || tok === 'admin' || tok === 'worker') state.role = tok;
if (!state.tourSeen && !tok) ui.start = true;
renderScreen();
/* 눌러 보는 중에 화면이 바뀌지 않도록, 손가락이 닿아 있을 땐 다시 그리지 않아요 */
let tickN = 0, pressing = false, pending = false;
document.addEventListener('pointerdown', () => { pressing = true; }, true);
document.addEventListener('pointerup', () => { pressing = false; if (pending) { pending = false; setTimeout(renderTick, 250); } }, true);
document.addEventListener('pointercancel', () => { pressing = false; }, true);
setInterval(() => {
  if (!state.playing || ui.ff || document.hidden) return;
  const res = advance(1);
  tickN++;
  if (res.created.length || tickN % 10 === 0) { if (pressing) pending = true; else renderTick(); }
  else if (ui.sheetOpen) { const c = $('#simclock'); if (c) c.textContent = `${fmtDate(state.now)} ${fmtTime(state.now)}`; }
  if (tickN % 15 === 0) save();
}, 1000);
</script>
</body>
